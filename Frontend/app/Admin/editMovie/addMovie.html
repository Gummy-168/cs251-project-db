<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Emerald Cinema - Add New Movie</title>
    <link rel="stylesheet" href="editMovie.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
</head>
<body class="dashboard-body">
    <div class="sidebar">
    <div class="logo">
        <h1>EMERALD CINEMA</h1>
        <span>PROJECTION BOOTH V1.0</span>
    </div>
    <nav>
        <div class="nav-item">REPORT</div>
        <div class="nav-item">EVENT HANDLING</div>
        <div class="nav-item">MANAGE SHOWTIME</div>
        <div class="nav-item active">EDIT MOVIE</div>
    </nav>
    <button class="logout-btn">LOG OUT</button>
</div>

    <main class="content">
        <div class="back-nav" onclick="window.location.href='editMovie.html'" style="cursor:pointer; margin-bottom:20px;">
            <span>← Back</span>
        </div>
        
        <h2>เพิ่มภาพยนตร์ใหม่ (Add New Movie)</h2>

        <form class="add-movie-form">
            <div class="form-layout">
                <div class="upload-section">
                    <div class="upload-placeholder">
                        <span>UPLOAD PICTURE</span>
                        <small>MIN. 1200 x 1800 PX</small>
                    </div>
                    <p style="font-size: 12px; margin-top: 10px;">POSTER PREVIEW DIMENSION 2:3</p>
                </div>

                <div class="fields-section" style="flex: 1;">
                    <div class="input-group">
                        <label>MOVIE NAME</label>
                        <input type="text" placeholder="Enter movie title...">
                    </div>
                    <div style="display: flex; gap: 20px;">
                        <div class="input-group" style="flex: 1;">
                            <label>MOVIE ID</label>
                            <input type="text" value="ID: 0890" readonly style="background: rgba(88, 193, 100, 0.1);">
                        </div>
                        <div class="input-group" style="flex: 1;">
                            <label>RATING</label>
                            <input type="text" placeholder="8.5">
                        </div>
                    </div>
                    <div class="input-group">
                        <label>DESCRIPTION</label>
                        <textarea style="height: 150px;"></textarea>
                    </div>
                    <button type="submit" class="save-btn">💾 SAVE</button>
                </div>
            </div>
        </form>
    </main>
</body>
</html>
