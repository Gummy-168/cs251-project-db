<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>Emerald Cinema - Update Movie</title>
    <link rel="stylesheet" href="editMovie.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
</head>

<body class="dashboard-body">
    <div class="sidebar">
        <div class="logo">
            <h1>EMERALD CINEMA</h1>
            <span>PROJECTION BOOTH V1.0</span>
        </div>
        <nav>
            <div class="nav-item">REPORT</div>
            <div class="nav-item">EVENT HANDLING</div>
            <div class="nav-item">MANAGE SHOWTIME</div>
            <div class="nav-item active">EDIT MOVIE</div>
        </nav>
        <button class="logout-btn">LOG OUT</button>
    </div>

    <main class="content">
        <div class="back-nav" style="cursor:pointer; margin-bottom:20px; color: #58c164;">
            <span>← Back</span>
        </div>

        <h2>แก้ไขข้อมูลภาพยนตร์ (Update Movie)</h2>

        <form class="add-movie-form">
            <div class="form-layout">
                <div class="upload-section">
                    <div class="upload-placeholder" style="border-style: solid; border-color: #58c164;">
                        <img src="https://via.placeholder.com/200x300"
                            style="width:100%; height:100%; object-fit:cover;">
                    </div>
                    <p style="font-size: 12px; margin-top: 10px; color: #58c164;">CHANGE PICTURE</p>
                </div>

                <div class="fields-section" style="flex: 1;">
                    <div class="input-group">
                        <label>MOVIE NAME</label>
                        <input type="text" id="editMovieName" value="">
                    </div>
                    <div style="display: flex; gap: 20px; align-items: flex-end; margin-bottom: 25px;">

                        <div style="flex: 0.5;">
                            <label style="display: block; color: #888; font-size: 12px; margin-bottom: 8px;">MOVIE
                                ID</label>
                            <span id="displayMovieId"
                                style="color: var(--accent-green); font-family: 'Inter', sans-serif; font-weight: bold; font-size: 18px;">
                                #0890
                            </span>
                        </div>

                        <div class="input-group" style="flex: 1; margin-bottom: 0;">
                            <label>RATING</label>
                            <input type="text" id="editRating" placeholder="8.5">
                        </div>
                    </div>
                    <div class="input-group">
                        <label>DESCRIPTION</label>
                        <textarea id="editDescription" style="height: 150px;"></textarea>
                    </div>
                    <div style="display: flex; justify-content: flex-end; gap: 15px;">
                        <button type="button" class="delete-btn"
                            style="background: #ff4b4b; color: white; padding: 12px 20px; border:none; border-radius:8px; cursor:pointer;">DELETE</button>
                        <button type="submit" class="save-btn">💾 UPDATE CHANGES</button>
                    </div>
                </div>
            </div>
        </form>
    </main>
    <!-- Saved Success Bubble -->
    <div id="saveBubble" class="save-bubble">Saved</div>

    <!-- Unsaved Changes Overlay -->
    <div id="unsavedOverlay" class="overlay-container">
        <div class="overlay-box">
            <p>You have unsaved changes. Want to continue?</p>
            <div class="overlay-buttons">
                <button id="cancelLeaveBtn" class="btn-cancel">Cancel</button>
                <button id="saveLeaveBtn" class="btn-save-leave">Save and leave</button>
            </div>
        </div>
    </div>
    <script src="editMovie.js"></script>
</body>

</html>
