<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <title>Emerald Cinema - Edit Movie</title>
    <link rel="stylesheet" href="editMovie.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;500&display=swap"
        rel="stylesheet">
</head>

<body class="dashboard-body">
    <div class="sidebar">
        <div class="logo">
            <h1>EMERALD CINEMA</h1>
            <span>PROJECTION BOOTH V1.0</span>
        </div>
        <nav>
            <div class="nav-item">REPORT</div>
            <div class="nav-item">EVENT HANDLING</div>
            <div class="nav-item">MANAGE SHOWTIME</div>
            <div class="nav-item active">EDIT MOVIE</div>
        </nav>
        <a href="../login/login.html" style="text-decoration: none; display: block; width: 100%;">
            <button class="logout-btn">LOG OUT</button>
        </a>
    </div>

    <main class="content">
        <header class="content-header">
            <h2>จัดการภาพยนตร์ (Edit Movie)</h2>
            <div class="search-bar">
                <input type="text" placeholder="SEARCH FILMS...">
            </div>
        </header>

        <div class="movie-grid">
            <div class="movie-card">
                <div class="poster-container">
                    <span class="movie-id">ID: 0890</span>
                    <img src="https://via.placeholder.com/200x300" alt="Movie Poster">
                </div>
                <div class="movie-info">
                    <h3>Neon Vanguard</h3>
                    <p>In a future where memory is a luxury...</p>
                    <button class="edit-btn-small" onclick="location.href='updateMovie.html?id=0890'">แก้ไข</button>
                </div>
            </div>

            <div class="movie-card">
                <div class="poster-container">
                    <span class="movie-id">ID: 0891</span>
                    <img src="https://via.placeholder.com/200x300" alt="Movie Poster">
                </div>
                <div class="movie-info">
                    <h3>Emerald Dreams</h3>
                    <p>A journey through the crystal forests...</p>
                    <button class="edit-btn-small" onclick="location.href='updateMovie.html?id=0891'">แก้ไข</button>
                </div>
            </div>
        </div>

        <button id="addMovieBtn" class="fab-btn">+</button>
    </main>

    <script src="editMovie.js"></script>
</body>

</html>
