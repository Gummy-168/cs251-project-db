<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emerald Cinema - Manage Showtime</title>
    <link rel="stylesheet" href="manageShowtime.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
</head>

<body class="dashboard-body">
    <div class="sidebar">
        <div class="logo">
            <h1>EMERALD CINEMA</h1>
            <span>PROJECTION BOOTH V1.0</span>
        </div>
        <nav>
            <div class="nav-item">REPORT</div>
            <div class="nav-item">EVENT HANDLING</div>
            <div class="nav-item active">MANAGE SHOWTIME</div>
            <div class="nav-item" onclick="location.href='../editMovie/editMovie.html'" style="cursor: pointer;">EDIT
                MOVIE</div>
        </nav>
        <button class="logout-btn">LOG OUT</button>
    </div>

    <main class="content">
        <header class="content-header">
            <div class="search-bar">
                <span class="search-icon">🔍</span>
                <input type="text" id="movieSearchInput" placeholder="Search Movie Name..." onkeyup="filterMovies()">
            </div>
        </header>

        <section class="showtime-controls">
            <div class="date-scroll-container" id="dateScrollContainer">
            </div>

            <button class="create-btn" onclick="openOverlay()">
                <span class="plus-icon">+</span>
                Create New Showtime
            </button>
        </section>

        <div id="showtimeDataDisplay">
        </div>

        <button class="fab-calendar-btn" onclick="openOverlay()">
            📅<span>+</span>
        </button>
    </main>
    <div id="showtimeOverlay" class="overlay">
        <div class="overlay-content">
            <button class="close-overlay" onclick="closeOverlay()">✕</button>
            <h3>Select the showtime date</h3>

            <div class="form-group">
                <input type="date" id="showtimeDate" class="date-input">
            </div>

            <button class="add-confirm-btn" onclick="submitNewShowtime()">Add</button>
        </div>
    </div>
    <script src="manageShowtime.js"></script>
</body>

</html>
